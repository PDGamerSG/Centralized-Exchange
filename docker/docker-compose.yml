services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: exchange-timescaledb
    ports:
      # Host port 5433: a native PostgreSQL install on Windows commonly owns
      # 5432 and silently intercepts connections meant for this container.
      # Loopback-only: dev credentials must not be reachable from the LAN.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
    volumes:
      - timescale-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: exchange-redis
    ports:
      # Loopback-only: this Redis runs without auth.
      - "127.0.0.1:6379:6379"

volumes:
  timescale-data:
